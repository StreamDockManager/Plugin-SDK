name: Prepare Release
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: sdk-prepare-release
    cancel-in-progress: false
jobs:
    checks:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: ./.github/workflows/checks.yml
    candidates:
        name: Prepare release artifacts (canonical repository only)
        needs: checks
        if: github.repository == 'StreamDockManager/Plugin-SDK' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@v7.0.0
              with:
                  go-version: '1.27.4'
                  cache: false
            - uses: dtolnay/rust-toolchain@stable
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.15'
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: '26'
            - run: python -m pip install setuptools==84.2.1 wheel
            - run: python tools/build.py deps
            - run: python -m unittest discover -s tests -p test_release.py -v
            - run: python tools/check_vendor_compatibility.py
            - run: python tools/build.py package
            - run: python tests/validate_candidates.py
            - run: python tools/release.py prepare
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: sdk-release-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      artifacts/stream-dock-manager-plugin-sdk-go-0.1.0.zip
                      artifacts/stream-dock-manager-plugin-sdk-0.1.0.crate
                      artifacts/stream-dock-manager-plugin-sdk-0.1.0.tgz
                      artifacts/stream_dock_manager_plugin_sdk-0.1.0-py3-none-any.whl
                      artifacts/release-manifest.json
                      artifacts/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 14
