name: Prepare Release
on:
    workflow_dispatch:
        inputs:
            runner_service:
                description: Runner service
                type: choice
                default: github
                options: [github, blacksmith]
permissions:
    contents: read
concurrency:
    group: sdk-prepare-release
    cancel-in-progress: false
jobs:
    checks:
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: ./.github/workflows/checks.yml
        with:
            runner_service: ${{ inputs.runner_service }}
    candidates:
        name: Prepare release artifacts (canonical repository only)
        needs: checks
        if: github.repository == 'StreamDockManager/Plugin-SDK' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        runs-on: ${{ inputs.runner_service == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.15'
            # Select the immutable Linux candidate that passed isolated validation in this attempt
            - uses: actions/download-artifact@v8.0.2
              with:
                  name: sdk-candidates-ubuntu-24.04-attempt-${{ github.run_attempt }}
                  path: artifacts
                  digest-mismatch: error
            - run: python tools/release.py prepare
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: sdk-release-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      artifacts/stream-dock-manager-plugin-sdk-go-0.1.1.zip
                      artifacts/stream-dock-manager-plugin-sdk-0.1.1.crate
                      artifacts/stream-dock-manager-plugin-sdk-0.1.1.tgz
                      artifacts/stream_dock_manager_plugin_sdk-0.1.1-py3-none-any.whl
                      artifacts/release-manifest.json
                      artifacts/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 14
