name: SDK checks
on:
    push:
        branches: [test-build]
    workflow_dispatch:
        inputs:
            targets:
                description: Native operating system to check
                type: choice
                default: all
                options: [all, linux, windows, macos]
            profile:
                description: Check source quickly or include the full version matrix and packaging
                type: choice
                default: quick
                options: [quick, full]
            runner_service:
                description: Runner service
                type: choice
                default: github
                options: [github, blacksmith]
    # Release preparation may choose a runner service, but always runs Full on all supported OSes
    workflow_call:
        inputs:
            runner_service:
                description: Runner service
                type: string
                default: github
permissions:
    contents: read
jobs:
    libraries:
        strategy:
            fail-fast: false
            matrix:
                os: >-
                    ${{ fromJSON(inputs.targets == 'linux' && '["ubuntu-24.04"]' ||
                        inputs.targets == 'windows' && '["windows-2022"]' ||
                        inputs.targets == 'macos' && '["macos-15"]' ||
                        '["ubuntu-24.04","windows-2022","macos-15"]') }}
        runs-on: >-
            ${{ inputs.runner_service == 'blacksmith' &&
                fromJSON('{"ubuntu-24.04":"blacksmith-4vcpu-ubuntu-2404","windows-2022":"blacksmith-4vcpu-windows-2025","macos-15":"blacksmith-6vcpu-macos-15"}')[matrix.os] ||
                matrix.os }}
        env:
            # Share source builds with the direct Cargo steps; candidate consumers still use a fresh target
            CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/rust-target
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-go@v7.1.0
              with:
                  go-version: '1.27.4'
                  cache: false
            - uses: dtolnay/rust-toolchain@stable
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.15'
            - run: python tools/check_vendor_compatibility.py
            - run: python tests/test_vendor_gate.py
            - run: python tests/test_vendor_upstream.py
            - run: python -m pip install -e "Python[thumbnail]"
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: '26'
                  cache: npm
                  cache-dependency-path: Node/package-lock.json
            - run: npm ci --ignore-scripts
              working-directory: Node
            - run: python tools/build.py test ${{ inputs.profile != 'quick' && '--go-race' || '' }}
            # The integrated job runs the same JavaScript suite as the version matrix on Node 26
            - uses: actions/upload-artifact@v7.0.2
              if: always()
              with:
                  name: javascript-bundles-${{ matrix.os }}-node-26
                  path: artifacts/tree-shaking/*.json
                  if-no-files-found: warn
            - run: cargo test --locked --no-default-features --manifest-path Rust/Cargo.toml
            - run: cargo clippy --locked --all-targets --all-features --manifest-path Rust/Cargo.toml -- -D warnings
            - run: python -m pip install setuptools==84.2.1 wheel
              if: inputs.profile != 'quick'
            - run: python tools/build.py package-built
              if: inputs.profile != 'quick'
            - run: python tests/validate_candidates.py
              if: inputs.profile != 'quick'
            - uses: actions/upload-artifact@v7.0.2
              if: inputs.profile != 'quick'
              with:
                  name: sdk-candidates-${{ matrix.os }}-attempt-${{ github.run_attempt }}
                  path: |
                      artifacts/stream-dock-manager-plugin-sdk-*
                      artifacts/stream_dock_manager_plugin_sdk-*.whl
                  if-no-files-found: error
                  retention-days: 14
    python:
        # Python 3.15 runs the same suites as part of the integrated libraries job
        strategy:
            fail-fast: false
            matrix:
                os: >-
                    ${{ fromJSON(inputs.targets == 'linux' && '["ubuntu-24.04"]' ||
                        inputs.targets == 'windows' && '["windows-2022"]' ||
                        inputs.targets == 'macos' && '["macos-15"]' ||
                        '["ubuntu-24.04","windows-2022","macos-15"]') }}
                python: ${{ fromJSON(inputs.profile == 'quick' && '["3.11"]' || '["3.11","3.12","3.13","3.14"]') }}
        runs-on: >-
            ${{ inputs.runner_service == 'blacksmith' &&
                fromJSON('{"ubuntu-24.04":"blacksmith-4vcpu-ubuntu-2404","windows-2022":"blacksmith-4vcpu-windows-2025","macos-15":"blacksmith-6vcpu-macos-15"}')[matrix.os] ||
                matrix.os }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: ${{ matrix.python }}
            # Python's wire and WebSocket tests use the shared JavaScript peer
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: '26'
                  cache: npm
                  cache-dependency-path: Node/package-lock.json
            - run: npm ci --ignore-scripts
              working-directory: Node
            - run: python -m pip install -e "Python[thumbnail]"
            - run: python tools/build.py test-python

    javascript:
        strategy:
            fail-fast: false
            matrix:
                os: >-
                    ${{ fromJSON(inputs.targets == 'linux' && '["ubuntu-24.04"]' ||
                        inputs.targets == 'windows' && '["windows-2022"]' ||
                        inputs.targets == 'macos' && '["macos-15"]' ||
                        '["ubuntu-24.04","windows-2022","macos-15"]') }}
                node: ${{ fromJSON(inputs.profile == 'quick' && '["22"]' || '["22","24"]') }}
        runs-on: >-
            ${{ inputs.runner_service == 'blacksmith' &&
                fromJSON('{"ubuntu-24.04":"blacksmith-4vcpu-ubuntu-2404","windows-2022":"blacksmith-4vcpu-windows-2025","macos-15":"blacksmith-6vcpu-macos-15"}')[matrix.os] ||
                matrix.os }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
                  cache-dependency-path: Node/package-lock.json
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.15'
            - run: npm ci --ignore-scripts
              working-directory: Node
            - run: npm run build
              working-directory: Node
            - run: python tests/run_javascript.py

            - uses: actions/upload-artifact@v7.0.2
              if: always()
              with:
                  name: javascript-bundles-${{ matrix.os }}-node-${{ matrix.node }}
                  path: artifacts/tree-shaking/*.json
                  if-no-files-found: warn
